<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/style.scss">
    <script src="./src/js/index.js" type="module"></script>
    
    <title>Airport Challenge</title>
    <link rel="icon" type="image/x-icon" href="./src/favicon.ico">
</head>
<body>
    <section class="flight-clock"></section>
    <hgroup class="flight-data">
        <h1 class="departures"> Departures 🛫  |  0 of 27 Departed</h1>
        <h1 class="arrivals"> Arrivals 🛬  | 0 of 27 Arrived</h1>
    </hgroup>
    <section class="board-controls">
        <input type="search" class="flight-search" placeholder="Search flight, origin or destination">
        <select class="status-filter">
            <option value="all">All statuses</option>
            <option value="scheduled">Scheduled</option>
            <option value="inflight">In flight</option>
            <option value="landed">Landed</option>
        </select>
    </section>
    <p class="filter-empty" hidden></p>
    <section class="flight-board"></section>
</body>
</html>
